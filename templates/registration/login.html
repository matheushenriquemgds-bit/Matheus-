{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="login-box px-3">
  <div class="text-center mb-4">
    <i class="bi bi-bank2 fs-1 text-primary"></i>
    <h1 class="h4 mt-2">Gestão Jurídica</h1>
  </div>
  <div class="card"><div class="card-body p-4">
    {% if form.errors %}<div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Usuário</label>
        <input class="form-control" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Senha</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div></div>
</div>
{% endblock %}
